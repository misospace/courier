---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: laneprofiles.courier.misospace.dev
spec:
  group: courier.misospace.dev
  names:
    kind: LaneProfile
    listKind: LaneProfileList
    plural: laneprofiles
    singular: laneprofile
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.concurrency
      name: Concurrency
      type: integer
    - jsonPath: .metadata.annotations.courier\.misospace\.dev/suspend
      name: Suspended
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: LaneProfile is a reusable model ensemble + framing referenced
          by CoderRuns.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              LaneProfileSpec defines a reusable model ensemble and its runtime framing.
              It is the seam that keeps Courier model-agnostic: roles may name cloud or
              local models in any mix, and nothing about a lane is baked into the core.
              When a field is added or removed here, mirror it in bootstrap.Profile
              (internal/bootstrap/config.go), which carries the portable spec for
              manager-bootstrapped profiles.
            properties:
              capacityGroup:
                description: |-
                  CapacityGroup names the opaque execution-capacity pool this lane draws
                  from — a shared provider deployment, credential pool, or piece of local
                  hardware. It is intentionally a bare name: Courier core never learns
                  what the pool is. Lanes that share a group share its capacity cooldown;
                  a lane with no group is its own capacity identity. Empty uses the lane
                  name.
                maxLength: 253
                type: string
              concurrency:
                default: 1
                description: |-
                  Concurrency is the maximum number of Running CoderRuns admitted on this
                  lane. A local lane is typically 1; a cloud lane can be much higher.
                minimum: 1
                type: integer
              context:
                description: |-
                  Context declares the per-role context budgets the harness enforces on
                  runs in this lane (#243, #295). An absent Context leaves the harness
                  owning no budget and the executor's default compaction standing. The
                  declared values are resolved at run time against the gateway-verified
                  model input limits by internal/harness; the API carries declarations
                  only and resolves nothing.
                properties:
                  compactAtPercent:
                    default: 75
                    description: |-
                      CompactAtPercent is the fraction of the effective input limit, as an
                      integer percent, at which step-boundary compaction fires for roles
                      that do not override it. The default mirrors the harness default and
                      is applied only when a Context policy is declared.
                    maximum: 99
                    minimum: 1
                    type: integer
                  outputReservation:
                    description: |-
                      OutputReservation reserves, for every role that does not override it,
                      the tokens the next turn's maximum output may take, so a prompt under
                      the effective limit cannot overrun at completion.
                    minimum: 0
                    type: integer
                  roles:
                    additionalProperties:
                      description: |-
                        ContextBudget is one role's declared context policy. A zero value declares
                        nothing: unset fields inherit the lane policy, which is why
                        CompactAtPercent carries no default here — a defaulted per-role percent
                        could not inherit a different lane-wide fraction.
                      properties:
                        compactAtPercent:
                          description: |-
                            CompactAtPercent overrides the lane's compaction fraction for this
                            role. Unset inherits the lane policy.
                          maximum: 99
                          minimum: 1
                          type: integer
                        maxInputTokens:
                          description: |-
                            MaxInputTokens declares the input ceiling for the role's bound model.
                            The effective limit is the minimum of this and the gateway-verified
                            limit: a lane can lower the limit, never raise it past what the
                            gateway advertises.
                          minimum: 1
                          type: integer
                        outputReservation:
                          description: |-
                            OutputReservation overrides the lane's output reservation for this
                            role. Unset inherits the lane policy.
                          minimum: 0
                          type: integer
                      type: object
                    description: |-
                      Roles maps a coordinator role name to its declared ceiling and
                      overrides of the lane defaults. A zero-valued entry inherits
                      everything and declares nothing.
                    type: object
                type: object
              framing:
                description: |-
                  Framing is free-text lane context injected into the coordinator prompt:
                  hardware reality, parallelism guidance, whether a load tool is available.
                type: string
              resources:
                description: |-
                  Resources sizes the pods Courier creates for runs on this lane using
                  Courier's narrowed pod-sizing vocabulary: claims are not expressible and
                  requests/limits keys are honoured verbatim. Limits are used exactly as
                  written and may be omitted; requests keep what the lane sets, but CPU and
                  memory requests are floored to the built-in default wherever they are
                  absent or non-positive, so no lane is BestEffort. A lane that configures
                  nothing gets the default whole (see DefaultPodResources).
                properties:
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits are the resources each pod on this lane is limited to, exactly
                      as written. Omitting limits is a documented operator choice.
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests are the resources each pod on this lane requests. CPU and
                      memory requests are floored to the built-in default wherever absent or
                      non-positive (see EffectivePodResources); other keys are used as
                      written.
                    type: object
                type: object
              roles:
                additionalProperties:
                  type: string
                description: |-
                  Roles maps a coordinator role (coordinator, coder, reviewer, ...) to a
                  model identifier understood by the configured model gateway.
                type: object
              runtimeImage:
                description: |-
                  RuntimeImage selects the coordinator runtime and repository toolchain for
                  runs on this lane. Empty uses the deployment's default coordinator image;
                  a lane may select any compatible image without changing Courier core.
                type: string
            required:
            - concurrency
            - roles
            type: object
          status:
            description: |-
              Status is operator-written lane state (capacity cooldown). It lives on
              the status subresource so spec writers (Helm, bootstrap) never clobber
              it.
            properties:
              capacityCooldown:
                description: |-
                  CapacityCooldown, when set, pauses new work for its capacity identity
                  until NextEligibleAt (#327). Cooldowns for other capacity identities
                  never gate this lane.
                properties:
                  capacityID:
                    description: |-
                      CapacityID is the capacity identity this cooldown belongs to: the
                      lane's CapacityGroup, or the lane name when the group is empty.
                    maxLength: 253
                    minLength: 1
                    type: string
                  exhaustionCount:
                    description: |-
                      ExhaustionCount is the number of distinct confirmed exhaustion events
                      whose per-run markers fall in the active cooldown window. The count is
                      recomputed from retained CoderRuns, avoiding an unbounded lane history.
                    minimum: 1
                    type: integer
                  lastExhaustedRun:
                    description: |-
                      LastExhaustedRun is the most recent run observed while folding the
                      active window. Per-run CoderRun status markers provide deduplication.
                    maxLength: 253
                    type: string
                  nextEligibleAt:
                    description: |-
                      NextEligibleAt is when discovery and admission for this capacity
                      identity may resume. It is the operator's bounded retry window, not a
                      provider-observed reset time (Courier never invents one).
                    format: date-time
                    type: string
                  reason:
                    description: |-
                      Reason is the operator-written explanation of why the cooldown exists.
                      It never carries executor freeform text.
                    maxLength: 256
                    type: string
                required:
                - capacityID
                - exhaustionCount
                - nextEligibleAt
                - reason
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
