---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: coderruns.courier.misospace.dev
spec:
  group: courier.misospace.dev
  names:
    kind: CoderRun
    listKind: CoderRunList
    plural: coderruns
    singular: coderrun
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .spec.repo
      name: Repo
      type: string
    - jsonPath: .spec.ref
      name: Ref
      type: integer
    - jsonPath: .spec.lane
      name: Lane
      type: string
    - jsonPath: .status.branch
      name: Branch
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.waitDuration
      name: Waited
      type: string
    - jsonPath: .status.runDuration
      name: Ran
      type: string
    - jsonPath: .status.pr
      name: PR
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: 'CoderRun is one immutable attempt at one goal: resolve an issue
          or fix a PR.'
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              CoderRunSpec is set once by a source adapter and is then immutable.

              There is deliberately no attempts field: each CoderRun is one immutable
              attempt at one goal. History is the sequence of runs linked by the branch/PR.
            properties:
              debug:
                description: Debug, when true, raises the pod log level for this run
                  only.
                type: boolean
              lane:
                description: Lane names the LaneProfile that supplies the model ensemble
                  and framing.
                minLength: 1
                type: string
              mode:
                description: 'Mode is the kind of work: resolve-issue or fix-pr.'
                enum:
                - resolve-issue
                - fix-pr
                type: string
              ref:
                description: Ref is the issue number (resolve-issue) or PR number
                  (fix-pr).
                minimum: 1
                type: integer
              repo:
                description: Repo is the target repository, "owner/name".
                minLength: 3
                pattern: ^[^/]+/[^/]+$
                type: string
              source:
                description: |-
                  Source names the adapter that created this run
                  (dispatch, github-label, cron, cli, web).
                minLength: 1
                type: string
              workItemID:
                description: |-
                  WorkItemID is the opaque identifier assigned by the source adapter. It
                  is persisted so lifecycle calls never need to infer source identity from
                  the Kubernetes name or the numeric ref.
                minLength: 1
                type: string
            required:
            - lane
            - mode
            - ref
            - repo
            - source
            - workItemID
            type: object
            x-kubernetes-validations:
            - message: spec is immutable
              rule: self == oldSelf
          status:
            description: CoderRunStatus is the observed state of a CoderRun.
            properties:
              activeOperations:
                additionalProperties:
                  description: |-
                    ActiveOperation is one concurrently dispatched tool/subagent operation in
                    the run's active-operation set. It is dispatch evidence for liveness
                    suppression — not liveness itself, not a checkpoint — and only a heartbeat
                    from the matching control incarnation is earned activity.
                  properties:
                    briefID:
                      description: |-
                        BriefID identifies the work unit the operation belongs to ("control"
                        for coordinator-level work). Brief IDs identify work units, not
                        transport attempts.
                      type: string
                    coordinatorPodUID:
                      description: CoordinatorPodUID is the control incarnation that
                        dispatched it.
                      type: string
                    dispatchedAt:
                      description: |-
                        DispatchedAt is when trusted control dispatched the operation. It is
                        diagnostic only: no liveness or timeout semantics attach to it, and
                        there is no operation-age limit.
                      format: date-time
                      type: string
                    workerPodUID:
                      description: WorkerPodUID is the worker pod executing it.
                      type: string
                  required:
                  - briefID
                  - coordinatorPodUID
                  - dispatchedAt
                  - workerPodUID
                  type: object
                description: |-
                  ActiveOperations is the set of currently dispatched tool/subagent
                  operations, keyed by a harness-generated operation ID unique within the
                  run across retries and pod restarts. Entries persist before dispatch and
                  clear only on verified completion or cancellation; a valid entry
                  suppresses stale-heartbeat reaping of its control incarnation. The
                  trusted broker is the only writer.
                maxProperties: 64
                type: object
              admittedAt:
                description: |-
                  AdmittedAt is when the run first left Pending past the lane
                  capacity/suspend gate. It is set exactly once and never overwritten: a
                  released claim that is re-admitted keeps its original admitted time.
                format: date-time
                type: string
              branch:
                description: |-
                  Branch is the observed work branch. Resolve-issue runs derive it from the
                  repository and issue; fix-pr runs adopt the branch attached to the PR.
                type: string
              checkFingerprint:
                description: |-
                  CheckFingerprint is the operator's compact identity of the last all-green
                  CI check observation while Verifying: the head commit plus the sorted
                  external check identifiers. A run leaves Verifying for AwaitingReview
                  only when two consecutive all-green observations carry the same
                  fingerprint; a pending or empty observation clears it, and a changed
                  check set resets it, so checks that are still registering cannot pass.
                type: string
              checkpoint:
                description: Checkpoint is the compact resumable state written by
                  the harness.
                properties:
                  completedBriefs:
                    description: CompletedBriefs are the delegation units finished
                      so far, in order.
                    items:
                      description: Brief is a completed delegation unit recorded in
                        the checkpoint.
                      properties:
                        commit:
                          description: Commit is the pushed commit produced by the
                            brief, if any.
                          type: string
                        id:
                          description: ID identifies the brief within the run.
                          type: string
                        summary:
                          description: |-
                            Summary is the objective/outcome of the brief; it also serves as the
                            recovery record when the checkpoint is lost and only git remains.
                          type: string
                      required:
                      - id
                      - summary
                      type: object
                    type: array
                  plan:
                    description: Plan is the coordinator's working plan.
                    type: string
                type: object
              conditions:
                description: Conditions is the standard condition set.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              failedCheckFingerprint:
                description: FailedCheckFingerprint is the compact identity (head
                  plus sorted check names) of the last fully-failed CI observation
                  while Verifying. A resolve-issue run hands off only when two consecutive
                  fully-failed observations carry the same fingerprint; a pending
                  or empty observation clears it, a changed set resets it, and fix-pr
                  does not use it.
                type: string
              finishedAt:
                description: |-
                  FinishedAt is when the run's execution ended (the transition to a
                  terminal phase: AwaitingReview, NeedsHuman, Done, or Failed). It is set
                  exactly once and never overwritten; a later transition (e.g.
                  AwaitingReview -> Done) does not move it.
                format: date-time
                type: string
              headRepo:
                description: |-
                  HeadRepo is the repository that owns the PR head branch for a fix-pr run.
                  It equals Spec.Repo for same-repository PRs and resolve-issue runs.
                type: string
              headSHA:
                description: |-
                  HeadSHA is the PR head commit observed when the run resolved its head,
                  recorded on the run for verification and resume. It is the observed
                  head, not an enforced pre-push gate.
                type: string
              heartbeat:
                description: Heartbeat is the last successful coordinator activity.
                properties:
                  at:
                    description: At is when the last successful activity occurred.
                    format: date-time
                    type: string
                  coordinatorPodUID:
                    description: |-
                      CoordinatorPodUID fences this heartbeat to one control incarnation.
                      Only a heartbeat whose UID matches the current coordinator pod may
                      reset the consecutive-restart streak or count as fresh for that
                      incarnation; a previous incarnation's heartbeat is never evidence
                      about the replacement pod.
                    minLength: 1
                    type: string
                  kind:
                    description: 'Kind is the activity kind: "stream" or "tool".'
                    type: string
                required:
                - at
                - coordinatorPodUID
                - kind
                type: object
              lastCommit:
                description: LastCommit is the last commit pushed to the work branch.
                type: string
              phase:
                description: Phase is the current lifecycle phase.
                enum:
                - Pending
                - Claimed
                - Running
                - Verifying
                - AwaitingReview
                - HandedOff
                - NeedsHuman
                - Done
                - Failed
                type: string
              pr:
                description: PR is the pull request opened by this run (number or
                  URL).
                type: string
              publicationPolicy:
                description: |-
                  PublicationPolicy is the immutable destination resolved by the operator
                  before launch. Its RunUID must match this object's current UID.
                properties:
                  baseOID:
                    description: BaseOID is the base ref tip observed at admission.
                    type: string
                  baseRef:
                    description: BaseRef is the exact base branch ref.
                    type: string
                  baseRepo:
                    description: BaseRepo is the provider-canonical repository receiving
                      the pull request.
                    type: string
                  credentialRefDigest:
                    description: |-
                      CredentialRefDigest is the SHA-256 identity of the projected broker
                      registration: name, type, endpoint, git endpoint template, and every
                      credential reference. The broker recomputes it from its own projection
                      and refuses service on mismatch. It never contains a credential value.
                    type: string
                  headAnchorOID:
                    description: |-
                      HeadAnchorOID is the fix-pr head OID observed at admission. It is an
                      ownership anchor, not a frozen tip.
                    type: string
                  prNumber:
                    description: PRNumber is set for fix-pr runs only.
                    type: integer
                  providerConfigRef:
                    description: ProviderConfigRef identifies the administrator-configured
                      forge provider.
                    type: string
                  providerEndpoint:
                    description: |-
                      ProviderEndpoint is the canonical API base of the pinned registration.
                      The broker verifies its projection against it and refuses service on
                      mismatch, so selection and enforcement stay the same record across
                      broker replacement.
                    type: string
                  runUID:
                    description: RunUID binds this policy to one CoderRun incarnation.
                    type: string
                  workInitiallyAbsent:
                    description: WorkInitiallyAbsent distinguishes an absent ref from
                      one with a tip at admission.
                    type: boolean
                  workOID:
                    description: WorkOID is the admission tip when the work ref already
                      existed.
                    type: string
                  workRef:
                    description: WorkRef is the exact publication branch ref.
                    type: string
                  workRepo:
                    description: WorkRepo is the provider-canonical repository that
                      owns the writable ref.
                    type: string
                required:
                - baseOID
                - baseRef
                - baseRepo
                - providerConfigRef
                - runUID
                - workInitiallyAbsent
                - workRef
                - workRepo
                type: object
              restarts:
                description: |-
                  Restarts counts infra relaunches (the crashloop backstop), not work
                  retries.
                type: integer
              runDuration:
                description: |-
                  RunDuration is the human-readable time between StartedAt and FinishedAt,
                  in Go duration format. Written once when FinishedAt is recorded.
                type: string
              startedAt:
                description: |-
                  StartedAt is when the coordinator container first reached Running.
                  Set once, never overwritten.
                format: date-time
                type: string
              telemetry:
                description: |-
                  Telemetry is the compact per-run summary tallied from the
                  coordinator's OpenCode event stream (#172). Best-effort: absent for
                  runs that ended before the event stream could be tallied.
                properties:
                  continuations:
                    type: integer
                  durationMillis:
                    format: int64
                    type: integer
                  maxContext:
                    format: int64
                    type: integer
                  modelCalls:
                    type: integer
                  sessions:
                    type: integer
                  subagents:
                    items:
                      description: |-
                        SubagentTally is the per (agent, model) accounting of `task` tool calls.
                        It records calls, errors, and aggregate wall time; subagent tokens are
                        not observable from the coordinator's stdout and are deliberately absent.
                      properties:
                        agent:
                          type: string
                        calls:
                          type: integer
                        errors:
                          type: integer
                        model:
                          type: string
                        runtimeMillis:
                          format: int64
                          type: integer
                      required:
                      - agent
                      type: object
                    type: array
                  tokens:
                    description: |-
                      TokenUsage is a per-run token tally summed over the coordinator's own
                      model steps. Subagent steps are not observable from the coordinator's
                      stdout, so they are not included.
                    properties:
                      cacheRead:
                        format: int64
                        type: integer
                      cacheWrite:
                        format: int64
                        type: integer
                      input:
                        format: int64
                        type: integer
                      output:
                        format: int64
                        type: integer
                      reasoning:
                        format: int64
                        type: integer
                      total:
                        format: int64
                        type: integer
                    type: object
                  toolCalls:
                    type: integer
                type: object
              waitDuration:
                description: |-
                  WaitDuration is the human-readable time between creation and StartedAt,
                  in Go duration format (e.g. "3m5s"). Written once when StartedAt is
                  recorded.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
