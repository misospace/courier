# This chart is powered by the bjw-s common library and uses its native
# values API — the same shape as an app-template HelmRelease:
# https://bjw-s-labs.github.io/helm-charts/docs/common-library/
#
# Courier-specific configuration is plain manager flags under
# `controllers.main.containers.main.args` and the RBAC objects under `rbac:`.
# Required Secret keys for coordinator pods are documented in BOOTSTRAP.md.

# -- CRDs are rendered as regular resources so `helm upgrade` evolves them;
# they carry helm.sh/resource-policy=keep and survive uninstall. Disable to
# manage CRDs out-of-band.
crds:
  enabled: true

# -- Deployment ownership boundary. The operator reconciles CoderRuns only in
#    these namespaces; a run in any other namespace belongs to another
#    release's controller and is a strict no-op (no status writes, source
#    calls, pod or secret access, finalizer or retention action). Required
#    when a second release runs side-by-side: list every namespace carrying
#    this release's runs, and the operator namespace too when any discovery
#    source is enabled (discovery materializes runs there). Empty keeps the
#    single-controller default: secure mode owns secure.runNamespace, legacy
#    mode owns every namespace. The manager's run/lane/pod watches and the
#    capacity and retention gauges follow this set; preflight reads of nodes,
#    namespaces and cluster services stay unrestricted.
ownership:
  namespaces: []
  # -- Lease name for leader election. Two releases sharing one operator
#    namespace need distinct IDs; separate operator namespaces already
#    isolate the lease. Empty keeps "courier.misospace.dev".
  leaderElectionID: ""

executor:
  openCode:
    agent: coordinator
  mcp:
    githubURL: ""
    context7URL: ""
    metricsURL: ""

dispatch:
  # Dispatch is optional. queueLane selects work in Dispatch; laneProfile is
  # the Courier LaneProfile assigned to materialized CoderRuns.
  enabled: false
  prFixExclusions: false
  baseURL: ""
  agentName: ""
  queueLane: ""
  laneProfile: ""
  # -- Optional list of lane bindings; each entry pairs a Dispatch queueLane
  #    with a Courier laneProfile and optional stable agentName. Repeated queue
  #    lanes need distinct explicit agentName values.
  lanes: []
  pollInterval: 30s
  httpTimeout: 30s
  tokenSecret:
    name: ""
    key: token

# Forge label source (#16): issues carrying the trigger label become
# resolve-issue runs and pull requests carrying the fix label become fix-pr
# runs. Discovery and settlement reuse the operator's own forge credential
# Secret (--observer-credential-secret, --github-credential-secret, or
# --git-credential-secret); no separate token is configured here.
labelSource:
  enabled: false
  # -- owner/repo list the label source discovers work in.
  repos: []
  triggerLabel: courier
  fixLabel: changes-requested
  # -- Courier LaneProfile assigned to discovered label-source work.
  lane: ""
  pollInterval: 30s

# -- Deployment-managed bootstrap LaneProfiles. A map of lane name to the
#    lane's portable spec, serialized into a release ConfigMap mounted into
#    the manager and passed through --bootstrap-lane-profiles-file; the
#    manager creates and updates those LaneProfile objects itself, labeled
#    courier.misospace.dev/bootstrap-managed. Helm never renders LaneProfile
#    resources, so lanes can never race the CRD during install. Entries carry
#    the full portable spec: optional runtimeImage, concurrency, required
#    roles (role name -> model), multi-line framing, and the optional
#    capacityGroup, context, resources, and ciRepair fields documented in
#    BOOTSTRAP.md. No secrets belong on this surface. A values change updates
#    the ConfigMap and the pod template's configMaps checksum, so a normal
#    helm upgrade rolls the manager without an external reloader. An explicit
#    --bootstrap-lane-profiles-file arg under
#    controllers.main.containers.main.args takes precedence and disables this
#    transport. Separately applied (user-managed) LaneProfile CRs remain
#    supported and are never touched by either mechanism.
laneProfiles: {}
  # bootstrap:
  #   concurrency: 1
  #   runtimeImage: ghcr.io/misospace/courier-go:0.1.0
  #   roles:
  #     coordinator: litellm/your-model
  #   framing: |
  #     keep parallelism modest and leave the pull request ready for review
cron:
  # -- Scheduled jobs, rendered into a release ConfigMap mounted into the
  # manager and passed through --cron-schedules-file; empty disables the
  # cron source. Map of job name to job spec: repo (owner/name), issue
  # (positive issue or pull request number), lane (LaneProfile name), and
  # schedule (5-field cron) are required; timezone (IANA name, default
  # UTC), mode (resolve-issue|fix-pr, default resolve-issue), and debug are
  # optional. Occurrence identity, missed-run, and restart semantics are
  # documented in docs/cron-schedules.md. A values change updates the
  # ConfigMap and the pod template's configMaps checksum, so a normal helm
  # upgrade rolls the manager. An explicit --cron-schedules-file arg under
  # controllers.main.containers.main.args takes precedence and disables
  # this transport.
  # cron:
  #   nightly-triage:
  #     repo: misospace/courier
  #     issue: 15
  #     lane: frontier
  #     schedule: "30 2 * * *"
  #     timezone: America/New_York
  schedules: {}
  # -- Cron discovery poll interval.
  pollInterval: 30s

# -- Secure topology (HARNESS.md). Disabled by default: the legacy
# single-pod coordinator remains explicitly insecure. When enabled, every
# run is provisioned as one trusted control pod, one untrusted worker pod,
# and one per-run trusted broker pod behind a run-specific Service, in the
# dedicated run namespace. `providers` is the deployment-level forge provider
# registry, rendered into a ConfigMap the operator reads at startup; it
# carries references only — credential values never appear here.
secure:
  enabled: false
  # -- The namespace dedicated to secure runs. Required when enabled.
  runNamespace: ""
  # -- Registry of forge provider registrations. Each entry: name, type
  #    (github), endpoint (https API base), optional gitEndpoint template
  #    (one %s), optional gitUsername, credentials (purpose forge-api, and
  #    optional git: {secretName, key} — secretNames must reference Secrets
  #    in the operator's namespace that are NOT injected into legacy pods),
  #    and serves (case-insensitive owner/name patterns, e.g. misospace/*).
  providers: []
  # -- Image carrying courier-control, courier-worker, and courier-broker.
  #    The lane's spec.runtimeImage overrides it for the worker pod only
  #    (control and broker always render this image); the published
  #    courier-harness-go image layers the same binaries onto the Go
  #    toolchain base for Go lanes.
  harnessImage:
    repository: ghcr.io/misospace/courier-harness
    tag: ""
  probeImage: "busybox:1.38@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e"
  dependencyCacheService: ""
  dependencyCachePort: 0
  # -- Name of the ClusterRole granting per-run brokers TokenReview
#    creation. The chart renders the ClusterRole and passes the same name to
#    the operator, whose per-run ClusterRoleBindings reference it. Two
#    secure-enabled releases sharing one cluster must set distinct values so
#    the fixed cluster-scoped name never collides (#632); empty keeps the
#    historical "courier-broker-tokenreview". Change it only while no secure
#    runs are live: a run provisioned under the old name keeps its existing
#    binding target until its topology is revoked.
  brokerTokenReviewClusterRole: ""
  # -- Model gateway for the native harness control pod (#124). url is the
  #    OpenAI-compatible API root (for example http://litellm:4000/v1);
  #    keySecret names a Secret in the operator's namespace whose key holds
  #    the gateway key (the operator copies it per run into trusted control
  #    only); cidr/port optionally pin the control egress slot for the
  #    gateway. An empty url means secure runs fail closed on the
  #    model-bindings capability.
  modelGateway:
    url: ""
    keySecret: ""
    keySecretKey: "key"
    cidr: ""
    port: 0

# -- Optional Prometheus Operator ServiceMonitor for the controller's
# metrics endpoint (port 8080). When enabled, renders a `<release>-metrics`
# Service and a ServiceMonitor that scrapes `/metrics` on it. `labels` is a
# list of "key=value" strings, not a map, because the common library
# reserves `serviceMonitor.<key>` for its own ServiceMonitor entries.
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: []

evidence:
  # -- Failure-evidence intake (#115). Disabled by default. When enabled the
  #    manager serves the write-only intake listener on its bind port and the
  #    chart renders the ClusterIP Service coordinator pods POST bundles to.
  enabled: false
  # -- Name of a Secret in the operator namespace whose "key" entry holds the
  #    HMAC signing key (see BOOTSTRAP.md). Required when enabled.
  keySecret: ""
  # -- Port the intake listener binds to inside the manager container; the
  #    rendered Service routes port 80 to it.
  port: 8082

retention:
  # -- Terminal CoderRun retention (#287). The controller deletes terminal runs
  #    after these windows and always keeps the most recent `auditKeep` terminal
  #    runs per repository for audit. `done` applies to resolved Done runs;
  #    `failed` and `needsHuman` apply once a run's lifecycle report has
  #    settled. Rendered as the matching `--*-retention` manager flags; an
  #    empty value leaves the manager default.
  done: 5m
  failed: 168h
  needsHuman: 168h
  # -- Number of most recent terminal runs per repository always retained,
  #    even past their retention window. Negative disables the floor.
  auditKeep: 5

controllers:
  main:
    replicas: 1
    pod:
      # The manager talks to the Kubernetes API with its ServiceAccount
      # token, which the library hardening default would leave unmounted.
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    containers:
      main:
        env:
          POD_NAMESPACE:
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
        image:
          # -- Image repository.
          repository: ghcr.io/misospace/courier
          # -- Image tag. Empty falls back to the chart appVersion.
          tag: ""
          # -- Image digest (sha256:...); takes precedence over tag when set.
          digest: ""
          pullPolicy: IfNotPresent
        # -- Manager flags. Commonly overridden keys:
        #   --executor-image           coordinator image (courier-executor +
        #                               git + opencode + model config); defaults
        #                               to the chart appVersion release tag
        #   --git-remote-template      forge remote URL template, one %s
        #                               placeholder filled with spec.repo
        #   --git-credential-secret    Secret with username/token keys for
        #                               git access; empty disables git injection
        #   --git-token-key             Optional key for the git token; defaults to token
        #   --github-credential-secret  Optional Secret for the GitHub API token;
        #                               empty falls back to --git-credential-secret
        #   --github-token-key          Optional key for the GitHub API token;
        #                               empty falls back to --git-token-key or token
        #   --observer-credential-secret
        #                               Secret carrying the trusted operator's
        #                               own forge credential; wins over
        #                               --github-credential-secret for operator
        #                               observation and is never injected into
        #                               coordinator pods (#638)
        #   --observer-credential-key   Optional key within it; requires
        #                               --observer-credential-secret; empty
        #                               falls back to --github-token-key,
        #                               --git-token-key, or token
        #   --executor-environment-secret
        #                               Secret exposed to coordinator pods for
        #                               model/provider environment
        #   --git-author-name / --git-author-email /
        #   --git-committer-name / --git-committer-email
        #                               git identity rendered into coordinator
        #                               pods; empty falls back to the explicit
        #                               default Courier <courier@localhost>.
        #                               These explicit pod env values win over
        #                               same-named keys of
        #                               --executor-environment-secret. GitHub
        #                               attribution needs an account-associated
        #                               email; authorship is separate from
        #                               authentication and commit signing.
        args:
          - --leader-elect
          - --git-remote-template=https://github.com/%s.git
          - --git-credential-secret=courier-github
          # - --github-credential-secret=courier-github-api
          # - --github-token-key=token
          # - --git-author-name=bot
          # - --git-author-email=123456+bot@users.noreply.github.com
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 8081
              initialDelaySeconds: 15
              periodSeconds: 20
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /readyz
                port: 8081
              initialDelaySeconds: 5
              periodSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL

serviceAccount:
  main: {}

# -- RBAC required by the operator. The ClusterRole rules mirror the
# +kubebuilder:rbac markers in internal/controller; keep both in sync.
# config/rbac/role.yaml is the generated reference for that comparison.
rbac:
  roles:
    operator:
      type: ClusterRole
      rules:
        - apiGroups: [""]
          resources: [pods]
          verbs: [create, delete, get, list, watch]
        - apiGroups: [""]
          resources: [secrets]
          verbs: [create, delete, get, list]
        - apiGroups: [""]
          resources: [serviceaccounts]
          verbs: [create, delete, get, list]
        - apiGroups: [""]
          resources: [services]
          verbs: [create, delete, get, list]
        - apiGroups: [""]
          resources: [nodes]
          verbs: [get, list]
        - apiGroups: [""]
          resources: [namespaces]
          verbs: [get]
        - apiGroups: [networking.k8s.io]
          resources: [networkpolicies]
          verbs: [create, delete, get, list]
        - apiGroups: [rbac.authorization.k8s.io]
          resources: [roles]
          verbs: [create, delete, get, list]
        - apiGroups: [rbac.authorization.k8s.io]
          resources: [rolebindings]
          verbs: [create, delete, get, list]
        - apiGroups: [rbac.authorization.k8s.io]
          resources: [clusterrolebindings]
          verbs: [create, delete, get, list]
        - apiGroups: [authorization.k8s.io]
          resources: [subjectaccessreviews, selfsubjectaccessreviews]
          verbs: [create]
        - apiGroups: [courier.misospace.dev]
          resources: [coderruns]
          verbs: [create, delete, get, list, patch, update, watch]
        - apiGroups: [courier.misospace.dev]
          resources: [coderruns/finalizers]
          verbs: [update]
        - apiGroups: [courier.misospace.dev]
          resources: [coderruns/status]
          verbs: [get, patch, update]
        - apiGroups: [courier.misospace.dev]
          resources: [laneprofiles]
          verbs: [create, get, list, patch, update, watch]
        - apiGroups: [courier.misospace.dev]
          resources: [laneprofiles/status]
          verbs: [get, patch, update]
    credential-reader:
      type: Role
      rules:
        - apiGroups: [""]
          resources: [secrets]
          verbs: [get]
    evidence:
      type: Role
      rules:
        - apiGroups: [""]
          resources: [secrets]
          verbs: [create, get, list, patch, delete]
    leader-election:
      type: Role
      rules:
        - apiGroups: [coordination.k8s.io]
          resources: [leases]
          verbs: [create, get, list, patch, update, watch]
        - apiGroups: [""]
          resources: [events]
          verbs: [create, patch, update]
  bindings:
    operator:
      type: ClusterRoleBinding
      roleRef:
        identifier: operator
      subjects:
        - identifier: main
    credential-reader:
      type: RoleBinding
      roleRef:
        identifier: credential-reader
      subjects:
        - identifier: main
    evidence:
      type: RoleBinding
      roleRef:
        identifier: evidence
      subjects:
        - identifier: main
    leader-election:
      type: RoleBinding
      roleRef:
        identifier: leader-election
      subjects:
        - identifier: main
