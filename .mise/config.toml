min_version = "2026.10.13"

[tools]
go = "1.27.2"
helm = "4.3.1"

[tasks.bootstrap]
description = "Install the pinned toolchain, controller-gen, setup-envtest, and envtest assets (idempotent; no codegen, no tests, no formatting)"
run = "hack/bootstrap.sh tools"

[tasks.check]
description = "CI-equivalent checks mirroring the CI static job: generated-code drift, tidy diff, gofmt, vet, build, image-gating scripts"
run = [
  """cg=$(sed -n 's/^CONTROLLER_TOOLS_VERSION ?= //p' Makefile) && se=$(sed -n 's/^ENVTEST_VERSION ?= //p' Makefile) && { [ -n "$cg" ] && [ -n "$se" ]; } || { echo "could not read tool pins from Makefile" >&2; exit 1; }; make manifests generate CONTROLLER_TOOLS_VERSION="$cg" ENVTEST_VERSION="$se\"""",
  """git diff --exit-code || { echo "generated code is stale; run 'make manifests generate' and commit" >&2; exit 1; }""",
  "go mod tidy -diff",
  """unformatted=$(gofmt -l .); if [ -n "$unformatted" ]; then printf '%s\\n' "$unformatted" >&2; exit 1; fi""",
  "go vet ./...",
  "go build ./...",
  "bash hack/test-ci-images-gating.sh",
]

[tasks.test]
description = "Authoritative suite: make test (manifests, generate, fmt, vet, go test -race) with envtest assets — a superset of the CI test job"
run = '''
cg=$(sed -n 's/^CONTROLLER_TOOLS_VERSION ?= //p' Makefile)
se=$(sed -n 's/^ENVTEST_VERSION ?= //p' Makefile)
k8s=$(sed -n 's/^ENVTEST_K8S_VERSION ?= //p' Makefile)
if [ -z "$cg" ] || [ -z "$se" ] || [ -z "$k8s" ]; then echo "could not read tool pins from Makefile" >&2; exit 1; fi
make setup-envtest ENVTEST_VERSION="$se"
export KUBEBUILDER_ASSETS="$(bin/setup-envtest use -p path "$k8s")"
make test CONTROLLER_TOOLS_VERSION="$cg" ENVTEST_VERSION="$se"
'''
