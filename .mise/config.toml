min_version = "2026.10.13"

[tools]
go = "1.27.3"
helm = "4.3.1"

[tasks.bootstrap]
description = "Install the pinned toolchain, controller-gen, setup-envtest, and envtest assets (idempotent; no codegen, no tests, no formatting)"
run = "hack/bootstrap.sh tools"

[tasks.check]
description = "CI-equivalent checks without requiring GNU make: generated-code drift, tidy diff, gofmt, vet, build, image-gating scripts"
run = [
  "sh hack/tools.sh generate",
  """git diff --exit-code -- ':(glob)api/**/zz_generated.deepcopy.go' charts/courier/crd-manifests config/rbac/role.yaml || { echo "generated code is stale; run 'sh hack/tools.sh generate', then commit" >&2; exit 1; }""",
  "go mod tidy -diff",
  """unformatted=$(gofmt -l .); if [ -n "$unformatted" ]; then printf '%s\\n' "$unformatted" >&2; exit 1; fi""",
  "go vet ./...",
  "go build ./...",
  "bash hack/test-ci-images-gating.sh",
]

[tasks.test]
description = "Equivalent of the Makefile test target (codegen, fmt, vet, go test -race) with envtest assets, without GNU make"
run = '''
set -eu
command -v go >/dev/null 2>&1 || { echo "go is required but not on PATH" >&2; exit 1; }
if ! command -v cc >/dev/null 2>&1 && ! command -v gcc >/dev/null 2>&1 && ! command -v clang >/dev/null 2>&1; then
  echo "no C compiler on PATH: 'go test -race' requires cgo and a C compiler, so the race-detector suite cannot run here; install cc, gcc, or clang" >&2
  exit 1
fi
if [ "$(go env CGO_ENABLED)" != 1 ]; then
  echo "CGO_ENABLED=0 is set: 'go test -race' requires cgo; unset CGO_ENABLED" >&2
  exit 1
fi
sh hack/tools.sh generate
k8s=$(sed -n 's/^ENVTEST_K8S_VERSION ?= //p' Makefile)
if [ -z "$k8s" ]; then echo "could not read ENVTEST_K8S_VERSION from Makefile" >&2; exit 1; fi
export KUBEBUILDER_ASSETS="$(bin/setup-envtest use -p path "$k8s")"
go fmt ./...
go vet ./...
go test -race ./... -coverprofile cover.out
'''
