# PR image publish: builds the coordinator and manager images and pushes them
# to GHCR tagged with the branch name, so an out-of-tree deployment (the #327
# smoke) can pull exact PR images instead of building locally. amd64 only: the
# smoke cluster is amd64; release builds keep their own multiarch path.
name: pr-images

on:
  push:
    branches:
      - relieved-horse
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.2"
          cache: true

      - name: Build binaries
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o dist/manager cmd/main.go
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o dist/courier-executor ./cmd/courier-executor

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push manager image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: manager
          build-args: BINARIES=prebuilt
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}-manager:pr-368

      - name: Push coordinator image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: coordinator
          build-args: BINARIES=prebuilt
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}-opencode:pr-368
