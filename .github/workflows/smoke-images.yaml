# Temporary smoke-workflow: builds the PR's manager and coordinator images on
# GHA and uploads them as artifacts for the isolated #327 deployment smoke.
# Remove before merge.
name: smoke-images
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.2"
          cache: false
      - name: Restore Go build cache
        id: go-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-images-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-images-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-images-${{ runner.os }}-
      - name: Build binaries
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o dist/manager cmd/main.go
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o dist/courier-executor ./cmd/courier-executor
      - name: Build manager image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: manager
          build-args: BINARIES=prebuilt
          tags: courier-327-manager:smoke
          load: true
      - name: Build coordinator image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: coordinator
          build-args: BINARIES=prebuilt
          tags: courier-327-coordinator:smoke
          load: true
      - name: Export images
        run: |
          docker save courier-327-manager:smoke | gzip > /tmp/manager.tar.gz
          docker save courier-327-coordinator:smoke | gzip > /tmp/coordinator.tar.gz
      - uses: actions/upload-artifact@v5.0.0
        with:
          name: smoke-images
          path: |
            /tmp/manager.tar.gz
            /tmp/coordinator.tar.gz
          retention-days: 3
