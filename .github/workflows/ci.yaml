name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.6"
          cache: true

      - name: Verify generated code is up to date
        run: |
          make manifests generate
          git diff --exit-code || { \
            echo "generated code is stale; run 'make manifests generate' and commit"; \
            exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Install setup-envtest
        run: make setup-envtest

      - name: Cache envtest assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.local/share/kubebuilder-envtest
          key: envtest-k8s-1.31-${{ runner.os }}-${{ runner.arch }}

      - name: Provision envtest assets
        run: |
          echo "KUBEBUILDER_ASSETS=$(bin/setup-envtest use -p path 1.31.x!)" >> "$GITHUB_ENV"

      - name: Test
        run: go test -race ./... -coverprofile cover.out

      - name: Build images
        run: |
          docker build --target manager -t courier:ci .
          docker build --target coordinator -t courier-coordinator:ci .

  vulnerability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.6"
          cache: true

      - name: Check vulnerabilities
        run: make govulncheck

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Lint chart
        run: |
          helm repo add bjw-s-labs https://bjw-s-labs.github.io/helm-charts
          helm dependency build charts/courier
          helm lint charts/courier
          helm template courier charts/courier --namespace courier-system > rendered.yaml
          test "$(grep -c '^kind: CustomResourceDefinition' rendered.yaml)" -eq 2
          if helm template courier charts/courier --namespace courier-system \
            --set crds.enabled=false | grep -q CustomResourceDefinition; then
            echo "crds.enabled=false still renders CRDs"
            exit 1
          fi
