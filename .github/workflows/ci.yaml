name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.1"
          cache: true

      - name: Verify generated code is up to date
        run: |
          make manifests generate
          git diff --exit-code || { \
            echo "generated code is stale; run 'make manifests generate' and commit"; \
            exit 1; }

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "files not gofmt-clean:"
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.1"
          cache: true

      - name: Install setup-envtest
        run: make setup-envtest

      - name: Cache envtest assets
        uses: actions/cache@v6.1.0
        with:
          path: ~/.local/share/kubebuilder-envtest
          key: envtest-k8s-1.31-${{ runner.os }}-${{ runner.arch }}

      - name: Provision envtest assets
        run: |
          echo "KUBEBUILDER_ASSETS=$(bin/setup-envtest use -p path 1.31.x!)" >> "$GITHUB_ENV"

      - name: Test
        run: go test -race ./... -coverprofile cover.out

  image-manager:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.4.1
        id: buildx

      - name: Cache Go build mounts
        id: go-cache
        uses: actions/cache@v6.1.0
        with:
          path: go-cache
          key: go-mounts-manager-${{ github.sha }}
          restore-keys: go-mounts-manager-

      - name: Inject Go build mounts
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {"go-cache/mod": "/go/pkg/mod", "go-cache/build": "/root/.cache/go-build"}
          skip-extraction: ${{ steps.go-cache.outputs.cache-hit }}

      - name: Build manager image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: manager
          tags: courier:ci
          load: true
          cache-from: type=gha,scope=manager
          cache-to: type=gha,mode=max,scope=manager

      - name: Validate manager image
        run: docker run --rm courier:ci --help

  image-coordinator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.1"
          cache: true

      - uses: docker/setup-buildx-action@v4.4.1
        id: buildx

      - name: Cache Go build mounts
        id: go-cache
        uses: actions/cache@v6.1.0
        with:
          path: go-cache
          key: go-mounts-coordinator-${{ github.sha }}
          restore-keys: go-mounts-coordinator-

      - name: Inject Go build mounts
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {"go-cache/mod": "/go/pkg/mod", "go-cache/build": "/root/.cache/go-build"}
          skip-extraction: ${{ steps.go-cache.outputs.cache-hit }}

      - name: Build coordinator image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: coordinator
          tags: courier-coordinator:ci
          load: true
          cache-from: type=gha,scope=coordinator
          cache-to: type=gha,mode=max,scope=coordinator

      - name: Validate coordinator image
        run: >-
          docker run --rm --entrypoint sh courier-coordinator:ci
          -c 'test -x /usr/local/bin/courier-executor && opencode --help'
      - name: Validate coordinator identity
        run: test "$(docker inspect --format '{{.Config.User}}' courier-coordinator:ci)" = "65532:65532"

      - name: Test coordinator scratch boundary (image)
        run: COURIER_COORDINATOR_IMAGE=courier-coordinator:ci go test -run 'ScratchBoundary|Scratch' ./internal/executor

  image-coordinator-go:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Detect runtime-affecting changes
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: |
            runtime:
              - Dockerfile
              - .dockerignore
              - Makefile
              - go.mod
              - go.sum
              - hack/**
              - .github/workflows/ci.yaml

      - uses: docker/setup-buildx-action@v4.4.1
        id: buildx

      - name: Cache Go build mounts
        id: go-cache
        uses: actions/cache@v6.1.0
        with:
          path: go-cache
          key: go-mounts-coordinator-go-${{ github.sha }}
          restore-keys: go-mounts-coordinator-go-

      - name: Inject Go build mounts
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {"go-cache/mod": "/go/pkg/mod", "go-cache/build": "/root/.cache/go-build"}
          skip-extraction: ${{ steps.go-cache.outputs.cache-hit }}

      - name: Build Go toolchain coordinator image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: coordinator-go
          tags: courier-go:ci
          load: true
          cache-from: type=gha,scope=coordinator-go
          cache-to: type=gha,mode=max,scope=coordinator-go

      - name: Validate Go toolchain coordinator image
        run: >-
          docker run --rm --entrypoint sh courier-go:ci
          -c 'test "$(id -u)" = 65532 && go version && make --version >/dev/null && helm version --short >/dev/null && controller-gen --version >/dev/null && test ! -x "$(command -v gh || true)"'
      - name: Validate Courier workflow in Go toolchain image
        if: github.event_name != 'pull_request' || steps.changes.outputs.runtime == 'true'
        run: |
          runtime_workspace="$(mktemp -d)"
          chmod 777 "$runtime_workspace"
          cleanup_runtime_workspace() {
            docker run --rm \
              --user 0:0 \
              --mount "type=bind,src=$runtime_workspace,dst=/workspace" \
              courier-go:ci \
              sh -ec 'rm -rf /workspace/* /workspace/.[!.]*' >/dev/null || true
            rmdir "$runtime_workspace" 2>/dev/null || true
          }
          trap cleanup_runtime_workspace EXIT
          test "$(docker inspect --format '{{.Config.User}}' courier-go:ci)" = "65532:65532"
          docker run --rm \
            --user 65532:65532 \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/source,readonly" \
            --mount "type=bind,src=$runtime_workspace,dst=/workspace" \
            --workdir /workspace \
            courier-go:ci \
            sh -ec 'cp -R /source/. /workspace/ && rm -rf /workspace/.git && sh hack/verify-courier-go-runtime.sh'

  images:
    runs-on: ubuntu-latest
    needs: [image-manager, image-coordinator, image-coordinator-go]
    if: always()
    steps:
      - name: Require every image job to pass
        run: |
          test "${{ needs.image-manager.result }}" = success
          test "${{ needs.image-coordinator.result }}" = success
          test "${{ needs.image-coordinator-go.result }}" = success

  vulnerability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.1"
          cache: true

      - name: Check vulnerabilities
        run: make govulncheck

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.1"
          cache: true

      - uses: azure/setup-helm@v5.0.1

      - name: Configure chart repository
        run: helm repo add bjw-s-labs https://bjw-s-labs.github.io/helm-charts

      - name: Test chart rendering
        run: go test ./charts/courier

      - name: Lint chart
        run: |
          helm dependency build charts/courier
          helm lint charts/courier
          helm template courier charts/courier --namespace courier-system > rendered.yaml
          helm package charts/courier --destination "$RUNNER_TEMP"
          test "$(grep -c '^kind: CustomResourceDefinition' rendered.yaml)" -eq 2
          app_version=$(awk '$1 == "appVersion:" { print $2; exit }' charts/courier/Chart.yaml)
          test "$(grep -c -F "image: ghcr.io/misospace/courier:${app_version}" rendered.yaml)" -eq 1
          test "$(grep -c -F -- "--executor-image=ghcr.io/misospace/courier-opencode:${app_version}" rendered.yaml)" -eq 1
          test "$(grep -c -F -- "--opencode-agent=coordinator" rendered.yaml)" -eq 1

          helm template courier charts/courier --namespace courier-system \
            --set executor.openCode.agent=architect \
            --set executor.mcp.githubURL=https://github.example/mcp \
            --set executor.mcp.context7URL=https://context7.example/mcp \
            --set executor.mcp.metricsURL=https://metrics.example/mcp \
            > rendered-executor.yaml
          test "$(grep -c -F -- "--opencode-agent=architect" rendered-executor.yaml)" -eq 1
          test "$(grep -c -F -- "--github-mcp-url=https://github.example/mcp" rendered-executor.yaml)" -eq 1
          test "$(grep -c -F -- "--context7-mcp-url=https://context7.example/mcp" rendered-executor.yaml)" -eq 1
          test "$(grep -c -F -- "--metrics-mcp-url=https://metrics.example/mcp" rendered-executor.yaml)" -eq 1

          helm template courier charts/courier --namespace courier-system \
            --set 'controllers.main.containers.main.args={--leader-elect,--git-remote-template=https://github.com/%s.git,--git-credential-secret=courier-github,--executor-image=ghcr.io/example/custom:1.2.3}' \
            > rendered-custom.yaml
          test "$(grep -c -- '--executor-image=ghcr.io/example/custom:1.2.3' rendered-custom.yaml)" -eq 1

          if helm template courier charts/courier --namespace courier-system \
            --set crds.enabled=false | grep -q CustomResourceDefinition; then
            echo "crds.enabled=false still renders CRDs"
            exit 1
          fi
